<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper-1);color:var(--ink-1);font-family:var(--font-sans);padding:18px;box-sizing:border-box}
.lbl{font:var(--type-label-xs);letter-spacing:var(--tracking-label);color:var(--ink-3);text-transform:uppercase}
.mono{font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;gap:var(--gap-segment)">
<div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div>
<div style="flex:1;height:24px;background:var(--accent-1)"></div><div style="flex:1;height:24px;background:var(--accent-1)"></div>
</div>
<div style="display:flex;gap:var(--gap-segment);margin-top:14px">
<div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div>
<div style="flex:1;height:24px;border:1px solid var(--bar-empty-edge);box-sizing:border-box"></div><div style="flex:1;height:24px;border:1px solid var(--bar-empty-edge);box-sizing:border-box"></div>
</div>
<div class="lbl" style="margin-top:12px">OVERSHOOT GROWS THE BAR · IT NEVER TURNS RED</div>
</body></html>
