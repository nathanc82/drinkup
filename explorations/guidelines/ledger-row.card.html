<!-- @dsCard group="Patterns" viewport="700x200" subtitle="Time · marker · note · running total, on a hairline." name="Ledger rows" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper-1);color:var(--ink-1);font-family:var(--font-sans);padding:18px;box-sizing:border-box}
.lbl{font:var(--type-label-xs);letter-spacing:var(--tracking-label);color:var(--ink-3);text-transform:uppercase}
.mono{font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;justify-content:space-between" class="lbl"><span>LOG</span><span>RUNNING</span></div>
<div style="border-top:1px solid var(--line-1);margin-top:8px"></div>
<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2)">
<span style="font:var(--type-data);width:52px">12:30</span><span style="width:9px;height:9px;background:var(--ink-1)"></span>
<span style="flex:1;font:var(--type-body);color:var(--ink-2)">with lunch</span><span style="font:var(--type-data-sm);color:var(--ink-4)">1.25</span></div><div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2)">
<span style="font:var(--type-data);width:52px">14:10</span><span style="width:9px;height:9px;background:var(--accent-1)"></span>
<span style="flex:1;font:var(--type-body);color:var(--ink-2)">40 min ago</span><span style="font:var(--type-data-sm);color:var(--ink-1)">1.50</span></div>
<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-3)">
<span style="font:var(--type-data);width:52px;color:var(--ink-5)">07</span><span style="width:9px;height:9px;border:1px solid var(--ink-5);box-sizing:border-box"></span>
<span style="flex:1;font:var(--type-body);color:var(--ink-5)">to come</span><span style="font:var(--type-data-sm);color:var(--ink-5)">1.75</span></div>
<div class="lbl" style="margin-top:12px">GHOST ROWS SHOW THE DAY'S SHAPE BEFORE IT HAPPENS</div>
</body></html>
