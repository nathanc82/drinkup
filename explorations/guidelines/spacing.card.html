<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4 · 8 · 10 · 14 · 18 · 24 · 26 · 34" name="Spacing scale" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper-1);color:var(--ink-1);font-family:var(--font-sans);padding:18px;box-sizing:border-box}
.lbl{font:var(--type-label-xs);letter-spacing:var(--tracking-label);color:var(--ink-3);text-transform:uppercase}
.mono{font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:12px">
<div style="text-align:center"><div style="width:4px;height:4px;background:var(--ink-1);margin:0 auto"></div><div class="lbl" style="margin-top:8px">4</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--ink-1);margin:0 auto"></div><div class="lbl" style="margin-top:8px">8</div></div><div style="text-align:center"><div style="width:10px;height:10px;background:var(--ink-1);margin:0 auto"></div><div class="lbl" style="margin-top:8px">10</div></div><div style="text-align:center"><div style="width:14px;height:14px;background:var(--ink-1);margin:0 auto"></div><div class="lbl" style="margin-top:8px">14</div></div><div style="text-align:center"><div style="width:18px;height:18px;background:var(--ink-1);margin:0 auto"></div><div class="lbl" style="margin-top:8px">18</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--ink-1);margin:0 auto"></div><div class="lbl" style="margin-top:8px">24</div></div><div style="text-align:center"><div style="width:26px;height:26px;background:var(--ink-1);margin:0 auto"></div><div class="lbl" style="margin-top:8px">26</div></div><div style="text-align:center"><div style="width:34px;height:34px;background:var(--ink-1);margin:0 auto"></div><div class="lbl" style="margin-top:8px">34</div></div>
<div style="flex:1;padding-left:14px;font:var(--type-body-sm);color:var(--ink-2)">24px is the screen gutter, 12px the row padding, 58px the status-bar clearance. Nothing is centred that could be aligned to the gutter.</div></div>
</body></html>
