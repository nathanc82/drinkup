<!-- @dsCard group="Patterns" viewport="700x150" subtitle="Hover dims or darkens. Press shifts 4px. No easing." name="States" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper-1);color:var(--ink-1);font-family:var(--font-sans);padding:18px;box-sizing:border-box}
.lbl{font:var(--type-label-xs);letter-spacing:var(--tracking-label);color:var(--ink-3);text-transform:uppercase}
.mono{font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;gap:14px;align-items:center">
<div style="width:180px;height:58px;background:var(--accent-1);color:#fff;display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-sans);letter-spacing:.06em;border-radius:var(--radius-2)">+ ONE CUP</div>
<div style="width:180px;height:58px;background:var(--accent-hover);color:#fff;display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-sans);letter-spacing:.06em;border-radius:var(--radius-2)">HOVER</div>
<div style="width:180px;height:58px;background:var(--accent-press);color:#fff;display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-sans);letter-spacing:.06em;border-radius:var(--radius-2)">PRESS</div>
<div style="flex:1;font:var(--type-body-sm);color:var(--ink-2)">No shadows anywhere except the round-button variant's 6px hard offset. No transitions on colour.</div></div>
</body></html>
