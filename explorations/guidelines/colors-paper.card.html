<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper-1);color:var(--ink-1);font-family:var(--font-sans);padding:18px;box-sizing:border-box}
.lbl{font:var(--type-label-xs);letter-spacing:var(--tracking-label);color:var(--ink-3);text-transform:uppercase}
.mono{font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;gap:10px"><div style="flex:1"><div style="height:52px;background:var(--paper-1);border:1px solid rgba(0,0,0,.08)"></div><div class="lbl" style="margin-top:8px">PAPER 1</div><div class="mono" style="font-size:11px;color:var(--ink-2);margin-top:4px">#e9e7e2</div></div><div style="flex:1"><div style="height:52px;background:var(--paper-2);border:1px solid rgba(0,0,0,.08)"></div><div class="lbl" style="margin-top:8px">PAPER 2</div><div class="mono" style="font-size:11px;color:var(--ink-2);margin-top:4px">#dedbd4</div></div><div style="flex:1"><div style="height:52px;background:var(--paper-3);border:1px solid rgba(0,0,0,.08)"></div><div class="lbl" style="margin-top:8px">PAPER 3</div><div class="mono" style="font-size:11px;color:var(--ink-2);margin-top:4px">#fbfaf8</div></div></div>
</body></html>
