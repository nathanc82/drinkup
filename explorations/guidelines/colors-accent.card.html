<!-- @dsCard group="Colors" viewport="700x130" subtitle="Orange marks two things only: now, and the primary act." name="Accent" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper-1);color:var(--ink-1);font-family:var(--font-sans);padding:18px;box-sizing:border-box}
.lbl{font:var(--type-label-xs);letter-spacing:var(--tracking-label);color:var(--ink-3);text-transform:uppercase}
.mono{font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;gap:10px"><div style="flex:1"><div style="height:52px;background:var(--accent-1);border:1px solid rgba(0,0,0,.08)"></div><div class="lbl" style="margin-top:8px">ACCENT</div><div class="mono" style="font-size:11px;color:var(--ink-2);margin-top:4px">#f25c1f</div></div><div style="flex:1"><div style="height:52px;background:var(--accent-hover);border:1px solid rgba(0,0,0,.08)"></div><div class="lbl" style="margin-top:8px">HOVER</div><div class="mono" style="font-size:11px;color:var(--ink-2);margin-top:4px">#d94d13</div></div><div style="flex:1"><div style="height:52px;background:var(--accent-press);border:1px solid rgba(0,0,0,.08)"></div><div class="lbl" style="margin-top:8px">PRESS</div><div class="mono" style="font-size:11px;color:var(--ink-2);margin-top:4px">#a83c0e</div></div><div style="flex:2;padding-left:14px;font:var(--type-body-sm);color:var(--ink-2)">Never for decoration, never two accents on one screen. If a screen has no live moment and no primary action, it has no orange.</div></div>
</body></html>
