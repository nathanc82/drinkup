<!-- @dsCard group="Type" viewport="700x170" subtitle="Times, volumes, counts, and every uppercase label." name="IBM Plex Mono — data" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper-1);color:var(--ink-1);font-family:var(--font-sans);padding:18px;box-sizing:border-box}
.lbl{font:var(--type-label-xs);letter-spacing:var(--tracking-label);color:var(--ink-3);text-transform:uppercase}
.mono{font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;gap:26px;align-items:flex-end">
<div><div style="font:var(--type-data)">14:10</div><div class="lbl" style="margin-top:8px">--TYPE-DATA · 14PX</div></div>
<div><div style="font:var(--type-data-sm)">1.50</div><div class="lbl" style="margin-top:8px">--TYPE-DATA-SM · 13PX</div></div>
<div><div style="font:var(--type-label);letter-spacing:var(--tracking-label)">TODAY · SAT 08 AUG</div><div class="lbl" style="margin-top:8px">--TYPE-LABEL · 10PX · .14EM</div></div>
</div>
</body></html>
