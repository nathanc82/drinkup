<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>H2O–8</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e9e7e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="H2O–8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper-1:#e9e7e2;--paper-2:#dedbd4;
  --ink-1:#17171a;--ink-2:#6c6a64;--ink-3:#8b8880;--ink-4:#a8a5a0;--ink-5:#c2bfb8;
  --line-1:#17171a;--line-2:#d6d3cc;--line-3:#e4e1da;--line-4:#c9c6bf;
  --accent:#f25c1f;--accent-press:#a83c0e;
  --sans:Archivo,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{background:var(--paper-1);color:var(--ink-1);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)}
button{font-family:inherit;color:inherit}
#app{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 24px 0;overflow:hidden;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.lbl{font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.lbl-xs{font:500 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--ink-3)}
.head{display:flex;justify-content:space-between;align-items:baseline}
.numeral{font:600 108px/.82 var(--sans);letter-spacing:-.05em}
.numeral-sm{font:600 64px/.82 var(--sans);letter-spacing:-.04em}
.of{font:500 24px/1 var(--sans);color:var(--ink-4);padding-bottom:8px}
.sub{font:400 13px/1 var(--mono);color:var(--ink-2);margin-top:11px}
.segs{display:flex;gap:4px;margin-top:18px}
.seg{flex:1;height:24px;box-sizing:border-box}
.rule{height:1px;background:var(--line-1);margin-top:22px}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line-2)}
.row.ghost{border-top-color:var(--line-3)}
.row .t{font:500 14px/1 var(--mono);width:52px}
.row .dot{width:9px;height:9px;background:var(--ink-1);flex:none}
.row .note{flex:1;font:400 14px/1 var(--sans);color:var(--ink-2)}
.row .run{font:500 13px/1 var(--mono);color:var(--ink-4)}
.ghost .t,.ghost .note,.ghost .run{color:var(--ink-5)}
.ghost .dot{background:transparent;border:1px solid var(--ink-5)}
.action{width:100%;height:58px;background:var(--accent);color:#fff;border:0;border-radius:3px;
  font:600 15px/1 var(--sans);letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:10px}
.action:active{background:var(--accent-press)}
.hint{text-align:center;font:400 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--ink-4);margin-top:10px}
.tabs{display:flex;border-top:1px solid var(--line-1);background:var(--paper-1);
  padding:13px 0 calc(10px + env(safe-area-inset-bottom))}
.tabs button{flex:1;background:none;border:0;padding:8px 0;font:500 10px/1 var(--mono);letter-spacing:.12em;color:var(--ink-4)}
.tabs button.on{color:var(--ink-1)}
.banner{margin-top:14px;padding:11px 13px;background:var(--ink-1);color:var(--paper-1);
  font:500 12px/1 var(--mono);letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:24px;right:24px;bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink-1);
  color:var(--paper-1);padding:13px 15px;font:500 11px/1 var(--mono);letter-spacing:.12em;
  display:flex;justify-content:space-between;align-items:center;z-index:40}
.sq{width:34px;height:34px;border:1px solid var(--line-2);background:none;border-radius:2px;
  font:400 15px/1 var(--mono);flex:none}
.sq:disabled{color:var(--line-4)}
.pager{display:flex;align-items:center;gap:12px;margin-top:16px;border-top:1px solid var(--line-1);padding-top:14px}
.pager .mid{flex:1;text-align:center}
.pager .lab{font:600 15px/1 var(--mono);letter-spacing:.06em}
.week{display:flex;gap:8px;margin-top:20px}
.daycol{flex:1;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:8px}
.daycol .bars{height:118px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.daycol .cnt{font:500 11px/1 var(--mono);color:var(--ink-4)}
.daycol .bar{width:100%;background:var(--ink-5)}
.daycol .foot{border-top:1px solid var(--line-1);padding-top:9px;text-align:center}
.daycol .dl{font:500 10px/1 var(--mono);letter-spacing:.1em;color:var(--ink-3)}
.daycol .dn{font:500 13px/1 var(--mono);color:var(--ink-3);margin-top:5px}
.srow{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line-2)}
.srow .main{flex:1;font:400 14px/1.3 var(--sans)}
.srow .desc{font:400 12px/1.4 var(--sans);color:var(--ink-4);margin-top:3px}
.srow .val{font:500 14px/1 var(--mono);color:var(--ink-2)}
.sw{width:44px;height:26px;border:0;border-radius:13px;background:var(--line-2);display:flex;align-items:center;
  justify-content:flex-start;padding:3px;box-sizing:border-box;flex:none}
.sw.on{background:var(--ink-1);justify-content:flex-end}
.sw span{width:20px;height:20px;border-radius:50%;background:#fff;display:block}
.ghostbtn{height:48px;background:none;border:1px dashed #b6b3ad;color:var(--ink-2);
  font:500 12px/1 var(--mono);letter-spacing:.12em;border-radius:3px;width:100%;margin-top:18px}
.panel{margin-top:22px;padding:20px;background:var(--paper-2)}
.sheet{position:absolute;inset:0;background:var(--paper-1);z-index:30;display:flex;flex-direction:column;padding:14px 24px 0}
.strip{display:flex;align-items:flex-end;gap:2px;height:82px;margin-top:12px;border-bottom:1px solid var(--line-1)}
.strip div{flex:1;background:var(--line-2)}
.stats{display:flex;gap:1px;background:var(--line-2);margin-top:20px}
.stats>div{flex:1;background:var(--paper-1);padding:12px 0 12px 12px}
.stats>div:first-child{padding-left:0}
.a2hs{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ink-1);
  color:var(--paper-1);padding:14px 16px;z-index:60;display:flex;gap:14px;align-items:flex-start}
.a2hs p{margin:0;font:400 13px/1.5 var(--sans)}
.a2hs button{background:none;border:0;color:var(--accent);font:500 11px/1 var(--mono);letter-spacing:.12em}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script src="app.js"></script>
</body>
</html>
