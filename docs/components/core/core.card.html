<!-- @dsCard group="Components" viewport="700x420" subtitle="Action, segments, ledger, toggle, pager, tabs" name="Core" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--paper-1);color:var(--ink-1);font-family:var(--font-sans);padding:20px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.lbl{font:var(--type-label-xs);letter-spacing:var(--tracking-label);color:var(--ink-3);margin-bottom:10px}</style></head><body>
<div>
  <div class="lbl">ACTIONBUTTON</div>
  <div style="height:58px;background:var(--action-bg);color:#fff;display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-sans);letter-spacing:.06em;border-radius:var(--radius-2)">+ ONE CUP</div>
  <div style="text-align:center;font:var(--type-label-xs);letter-spacing:var(--tracking-label);color:var(--ink-4);margin-top:10px">HOLD TO UNDO LAST</div>
  <div class="lbl" style="margin-top:24px">SEGMENTBAR · 10 OF 8</div>
  <div style="display:flex;gap:4px">
    <div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--ink-1)"></div><div style="flex:1;height:24px;background:var(--accent-1)"></div><div style="flex:1;height:24px;background:var(--accent-1)"></div>
  </div>
  <div class="lbl" style="margin-top:24px">TOGGLESWITCH</div>
  <div style="display:flex;gap:12px">
    <div style="width:44px;height:26px;border-radius:13px;background:var(--ink-1);display:flex;align-items:center;justify-content:flex-end;padding:3px;box-sizing:border-box"><span style="width:20px;height:20px;border-radius:50%;background:#fff"></span></div>
    <div style="width:44px;height:26px;border-radius:13px;background:var(--line-2);display:flex;align-items:center;padding:3px;box-sizing:border-box"><span style="width:20px;height:20px;border-radius:50%;background:#fff"></span></div>
  </div>
</div>
<div>
  <div class="lbl">NUMERALREADOUT</div>
  <div style="display:flex;align-items:flex-end;gap:10px"><div style="font:var(--type-numeral-sm);letter-spacing:var(--tracking-numeral)">06</div><div style="font:500 18px/1 var(--font-sans);color:var(--ink-4);padding-bottom:5px">/ 08</div></div>
  <div class="lbl" style="margin-top:24px">STEPPERHEADER</div>
  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:34px;height:34px;border:1px solid var(--line-2);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)">&lsaquo;</div>
    <div style="flex:1;text-align:center"><div style="font:600 15px/1 var(--font-mono);letter-spacing:.06em">03 – 09 AUG</div><div style="font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--ink-3);margin-top:6px">THIS WEEK · 2026</div></div>
    <div style="width:34px;height:34px;border:1px solid var(--line-2);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);color:var(--line-4)">&rsaquo;</div>
  </div>
  <div class="lbl" style="margin-top:24px">LEDGERROW</div>
  <div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line-2)"><span style="font:var(--type-data);width:52px">14:10</span><span style="width:9px;height:9px;background:var(--accent-1)"></span><span style="flex:1;font:var(--type-body);color:var(--ink-2)">40 min ago</span><span style="font:var(--type-data-sm)">1.50</span></div>
  <div class="lbl" style="margin-top:24px">TABBAR</div>
  <div style="display:flex;border-top:1px solid var(--line-1);padding:14px 0 0">
    <div style="flex:1;text-align:center;font:var(--type-label);letter-spacing:.12em">TODAY</div>
    <div style="flex:1;text-align:center;font:var(--type-label);letter-spacing:.12em;color:var(--ink-4)">DAYS</div>
    <div style="flex:1;text-align:center;font:var(--type-label);letter-spacing:.12em;color:var(--ink-4)">ALERTS</div>
    <div style="flex:1;text-align:center;font:var(--type-label);letter-spacing:.12em;color:var(--ink-4)">SETUP</div>
  </div>
</div>
</body></html>
